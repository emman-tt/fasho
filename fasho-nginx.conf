server {
  listen 443 ssl;
  listen [::]:443 ssl;
  server_name fasho.emmanverse.uk www.fasho.emmanverse.uk;  

  ssl_certificate     /etc/ssl/cloudflare/emmanverse.uk.pem;
  ssl_certificate_key /etc/ssl/cloudflare/emmanverse.uk.key;
    
  location / {
     proxy_pass http://127.0.0.1:3001;
     proxy_set_header Host $host;
     proxy_set_header X-Real-IP $remote_addr;
     proxy_set_header X-Forwarded-Proto $scheme; 
  } 
  
}
